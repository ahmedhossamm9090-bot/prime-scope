<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Scope - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: min(420px, 92%);
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 15px 50px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      min-height: 22px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      PRIME SCOPE
    </div>

    <div class="subtitle">
      لوحة تحكم الإدارة
    </div>

    <form id="loginForm">

      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        type="email"
        id="email"
        required
        autocomplete="username"
        placeholder="admin@example.com"
      >

      <label for="password">
        كلمة المرور
      </label>

      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
        placeholder="كلمة المرور"
      >

      <button id="loginButton" type="submit">
        تسجيل الدخول
      </button>

      <div id="message"></div>

    </form>

  </div>

<script>

const supabaseClient = window.supabase.createClient(
  window.PRIME_CONFIG.SUPABASE_URL,
  window.PRIME_CONFIG.SUPABASE_ANON_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  message.textContent = "";
  message.style.color = "";

  button.disabled = true;
  button.textContent = "جاري تسجيل الدخول...";

  try {

    const email = document
      .getElementById("email")
      .value
      .trim();

    const password = document
      .getElementById("password")
      .value;

    if (!email || !password) {
      throw new Error("اكتب البريد الإلكتروني وكلمة المرور.");
    }


    // تسجيل الدخول في Supabase
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {
      throw error;
    }


    if (!data.user) {
      throw new Error("لم يتم العثور على المستخدم.");
    }


    // البحث عن المستخدم في جدول profiles
    // العمود عندك اسمه id حسب جدول Supabase
    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("id, full_name, role")
        .eq("id", data.user.id)
        .single();


    if (profileError) {

      console.error(profileError);

      await supabaseClient.auth.signOut();

      throw new Error(
        "تم تسجيل الدخول لكن لم يتم العثور على بيانات الحساب في profiles."
      );
    }


    // التأكد أن الحساب Admin
    if (profile.role !== "admin") {

      await supabaseClient.auth.signOut();throw new Error(
        "هذا الحساب ليس لديه صلاحية Admin."
      );
    }


    message.style.color = "green";
    message.textContent = "تم تسجيل الدخول بنجاح...";


    // الانتقال للوحة الإدارة
    setTimeout(function() {
      window.location.href = "admin-dashboard.html";
    }, 700);


  } catch (error) {

    console.error("LOGIN ERROR:", error);

    message.style.color = "red";
    message.textContent =
      error.message || "حدث خطأ أثناء تسجيل الدخول.";

    button.disabled = false;
    button.textContent = "تسجيل الدخول";

  }

});

</script>

</body>
</html>
