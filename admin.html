<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Scope - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,.1);
    }

    h1, h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: #111;
      color: white;
      width: 100%;
    }

    .logout {
      background: #eee;
    }

    .dashboard {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }

    .topbar {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .images-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0 20px;
    }

    .images-preview img {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .message {
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #f0f0f0;
    }

    @media(max-width:700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

  <div class="login-box">

    <h1>Prime Scope</h1>
    <p>Admin Dashboard</p>

    <div id="loginMessage"></div>

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="admin@example.com"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

  </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage" class="dashboard hidden">

  <div class="topbar">

    <div>
      <h1>Prime Scope Admin</h1>
      <div id="adminEmail"></div>
    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>


  <!-- MESSAGE -->

  <div id="adminMessage"></div>


  <!-- ADD MATERIAL -->

  <div class="card">

    <h2>Add New Material</h2>

    <form id="materialForm">

      <div class="grid">

        <div>
          <label>Material ID</label>
          <input id="materialId" required>
        </div>

        <div>
          <label>Category ID</label>
          <input id="categoryId">
        </div>

        <div>
          <label>Name Arabic</label>
          <input id="nameAr" required>
        </div>

        <div>
          <label>Name English</label>
          <input id="nameEn" required>
        </div><div>
          <label>Color</label>
          <input id="color">
        </div>

        <div>
          <label>Origin</label>
          <input id="origin">
        </div>

        <div>
          <label>Type Arabic</label>
          <input id="typeAr">
        </div>

        <div>
          <label>Type English</label>
          <input id="typeEn">
        </div>

        <div>
          <label>Finish</label>
          <input id="finish">
        </div>

        <div>
          <label>Price Tier</label>
          <input id="priceTier">
        </div>

        <div>
          <label>Color Hex</label>
          <input id="colorHex" placeholder="#000000">
        </div>

        <div>
          <label>Color Group</label>
          <input id="colorGroup">
        </div>

        <div>
          <label>Density</label>
          <input id="density" type="number" step="any">
        </div>

        <div>
          <label>Water Absorption</label>
          <input id="waterAbsorption" type="number" step="any">
        </div>

        <div>
          <label>Compressive Strength</label>
          <input id="compressiveStrength" type="number" step="any">
        </div>

        <div>
          <label>Durability Score</label>
          <input id="durabilityScore" type="number" step="any">
        </div>

        <div>
          <label>Maintenance Tier</label>
          <input id="maintenanceTier">
        </div>

        <div>
          <label>Texture Grade</label>
          <input id="textureGrade">
        </div>

        <div class="full">
          <label>Usage Arabic</label>
          <textarea id="usageAr"></textarea>
        </div>

        <div class="full">
          <label>Usage English</label>
          <textarea id="usageEn"></textarea>
        </div>

      </div>


      <!-- IMAGES -->

      <h3>Material Images</h3>

      <input
        id="imageFiles"
        type="file"
        accept="image/*"
        multiple
      >

      <div id="imagePreview" class="images-preview"></div>


      <label>
        <input id="isFeatured" type="checkbox">
        Featured
      </label>

      <br><br>

      <label>
        <input id="isActive" type="checkbox" checked>
        Active
      </label>

      <br><br>

      <button type="submit" class="primary">
        Save Material
      </button>

    </form>

  </div>

</div>


<script>

  // ============================================
  // SUPABASE
  // ============================================

  const supabaseClient = window.supabase.createClient(
    window.PRIME_CONFIG.SUPABASE_URL,
    window.PRIME_CONFIG.SUPABASE_ANON_KEY
  );


  // ============================================
  // LOGIN
  // ============================================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.innerHTML =
        '<div class="message">Enter email and password.</div>';

      return;
    }


    message.innerHTML =
      '<div class="message">Logging in...</div>';


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      message.innerHTML =
        '<div class="message">' +
        error.message +
        '</div>';

      return;
    }


    await checkAdmin(data.user);

  }


  // ============================================
  // CHECK ADMIN
  // ============================================

  async function checkAdmin(user) {

    const { data: profile, error } =
      await supabaseClient
        .from("profiles")
        .select("role, full_name")
        .eq("id", user.id)
        .single();


    if (error || !profile) {

      await supabaseClient.auth.signOut();

      document.getElementById("loginMessage").innerHTML =
        '<div class="message">Admin profile not found.</div>';

      return;
    }if (profile.role !== "admin") {

      await supabaseClient.auth.signOut();

      document.getElementById("loginMessage").innerHTML =
        '<div class="message">Access denied. Admin only.</div>';

      return;
    }


    document.getElementById("loginPage")
      .classList.add("hidden");

    document.getElementById("adminPage")
      .classList.remove("hidden");

    document.getElementById("adminEmail")
      .textContent =
      profile.full_name || user.email;

  }


  // ============================================
  // LOGOUT
  // ============================================

  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  // ============================================
  // CHECK EXISTING SESSION
  // ============================================

  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {

      await checkAdmin(session.user);

    }

  }


  // ============================================
  // IMAGE PREVIEW
  // ============================================

  document
    .getElementById("imageFiles")
    .addEventListener("change", function() {

      const preview =
        document.getElementById("imagePreview");

      preview.innerHTML = "";


      [...this.files].forEach(file => {

        const reader = new FileReader();

        reader.onload = function(e) {

          const img =
            document.createElement("img");

          img.src = e.target.result;

          preview.appendChild(img);

        };

        reader.readAsDataURL(file);

      });

    });


  // ============================================
  // UPLOAD IMAGE
  // ============================================

  async function uploadImage(file, materialId) {

    const extension =
      file.name.split(".").pop();

    const fileName =
      materialId +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;


    const { error } =
      await supabaseClient.storage
        .from(
          window.PRIME_CONFIG.STORAGE_BUCKETS.MATERIALS
        )
        .upload(fileName, file, {
          cacheControl: "3600",
          upsert: false
        });


    if (error) {

      throw error;

    }


    const { data } =
      supabaseClient.storage
        .from(
          window.PRIME_CONFIG.STORAGE_BUCKETS.MATERIALS
        )
        .getPublicUrl(fileName);


    return data.publicUrl;

  }


  // ============================================
  // SAVE MATERIAL
  // ============================================

  document
    .getElementById("materialForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();


      const message =
        document.getElementById("adminMessage");


      message.innerHTML =
        '<div class="message">Saving material...</div>';


      try {

        const materialId =
          document.getElementById("materialId")
            .value.trim();


        if (!materialId) {

          throw new Error("Material ID is required.");

        }


        // ===============================
        // UPLOAD IMAGES
        // ===============================

        const files =
          document.getElementById("imageFiles").files;


        const imageUrls = [];


        for (const file of files) {

          message.innerHTML =
            '<div class="message">Uploading image: ' +
            file.name +
            '</div>';


          const url =
            await uploadImage(file, materialId);

          imageUrls.push(url);

        }


        // ===============================
        // INSERT MATERIAL
        // ===============================

        const material = {

          id: materialId,

          name_ar:
            document.getElementById("nameAr").value,

          name_en:
            document.getElementById("nameEn").value,

          category_id:
            document.getElementById("categoryId").value || null,
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: min(420px, 92%);
      background: #1b1b1b;
      border: 1px solid #806b2a;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      color: #d4af37;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #d4af37;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      color: #ff7777;
      min-height: 20px;
    }

    .loading {
      opacity: .6;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">PRIME SCOPE</div>

    <div class="subtitle">
      لوحة تحكم الإدارة
    </div>

    <form id="loginForm">

      <label for="email">البريد الإلكتروني</label>
      <input
        type="email"
        id="email"
        required
        autocomplete="username"
        placeholder="admin@example.com"
      >

      <label for="password">كلمة المرور</label>
      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
        placeholder="••••••••"
      >

      <button id="loginButton" type="submit">
        تسجيل الدخول
      </button>

      <div id="message"></div>

    </form>

  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Project configuration -->
  <script src="config.js"></script>

  <!-- Project Supabase wrapper -->
  <script src="supabaseClient.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "";
      button.classList.add("loading");
      button.textContent = "جاري تسجيل الدخول...";

      try {

        const supabase = window.PrimeSupabase?.getClient();

        if (!supabase) {
          throw new Error(
            "Supabase غير متصل. تأكد من إعدادات config.js"
          );
        }

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        const user = data.user;

        if (!user) {
          throw new Error("لم يتم العثور على المستخدم.");
        }

        const { data: profile, error: profileError } =
          await supabase
            .from("profiles")
            .select("role")
            .eq("uuid", user.id)
            .single();if (profileError) {
          await supabase.auth.signOut();
          throw new Error("تعذر التحقق من صلاحيات الحساب.");
        }

        if (profile.role !== "admin") {
          await supabase.auth.signOut();
          throw new Error("هذا الحساب ليس لديه صلاحية Admin.");
        }

        message.style.color = "#55dd88";
        message.textContent = "تم تسجيل الدخول بنجاح...";

        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 700);

      } catch (error) {

        console.error(error);

        message.style.color = "#ff7777";
        message.textContent =
          error.message || "حدث خطأ أثناء تسجيل الدخول.";

        button.classList.remove("loading");
        button.textContent = "تسجيل الدخول";
      }
    });
  </script>

</body>
</html>
