<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Scope - Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: min(420px, 92%);
      background: #1b1b1b;
      border: 1px solid #806b2a;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      color: #d4af37;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #d4af37;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      color: #ff7777;
      min-height: 20px;
    }

    .loading {
      opacity: .6;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">PRIME SCOPE</div>

    <div class="subtitle">
      لوحة تحكم الإدارة
    </div>

    <form id="loginForm">

      <label for="email">البريد الإلكتروني</label>
      <input
        type="email"
        id="email"
        required
        autocomplete="username"
        placeholder="admin@example.com"
      >

      <label for="password">كلمة المرور</label>
      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
        placeholder="••••••••"
      >

      <button id="loginButton" type="submit">
        تسجيل الدخول
      </button>

      <div id="message"></div>

    </form>

  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Project configuration -->
  <script src="config.js"></script>

  <!-- Project Supabase wrapper -->
  <script src="supabaseClient.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "";
      button.classList.add("loading");
      button.textContent = "جاري تسجيل الدخول...";

      try {

        const supabase = window.PrimeSupabase?.getClient();

        if (!supabase) {
          throw new Error(
            "Supabase غير متصل. تأكد من إعدادات config.js"
          );
        }

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        const user = data.user;

        if (!user) {
          throw new Error("لم يتم العثور على المستخدم.");
        }

        const { data: profile, error: profileError } =
          await supabase
            .from("profiles")
            .select("role")
            .eq("uuid", user.id)
            .single();if (profileError) {
          await supabase.auth.signOut();
          throw new Error("تعذر التحقق من صلاحيات الحساب.");
        }

        if (profile.role !== "admin") {
          await supabase.auth.signOut();
          throw new Error("هذا الحساب ليس لديه صلاحية Admin.");
        }

        message.style.color = "#55dd88";
        message.textContent = "تم تسجيل الدخول بنجاح...";

        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 700);

      } catch (error) {

        console.error(error);

        message.style.color = "#ff7777";
        message.textContent =
          error.message || "حدث خطأ أثناء تسجيل الدخول.";

        button.classList.remove("loading");
        button.textContent = "تسجيل الدخول";
      }
    });
  </script>

</body>
</html>
