<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prime Scope | Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --black: #0b0b0b;
      --black-2: #151515;
      --black-3: #202020;
      --gold: #d4af37;
      --gold-light: #f0d477;
      --white: #ffffff;
      --text: #eeeeee;
      --muted: #999999;
      --border: rgba(212,175,55,.25);
      --danger: #d9534f;
      --success: #36b37e;
      --card: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(212,175,55,.08), transparent 30%),
        var(--black);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11,11,11,.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1400px;
      margin: auto;
      padding: 18px 25px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: var(--gold);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: normal;
      margin-top: 4px;
      letter-spacing: 0;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* ================= BUTTONS ================= */

    .btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 17px;
      font-size: 14px;
      transition: .2s;
    }

    .btn-gold {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
      font-weight: bold;
    }

    .btn-gold:hover {
      background: var(--gold-light);
    }

    .btn-dark {
      background: var(--black-3);
      color: var(--white);
    }

    .btn-dark:hover {
      border-color: var(--gold);
    }

    .btn-danger {
      background: transparent;
      color: #ff7777;
      border-color: rgba(217,83,79,.5);
    }

    .btn-danger:hover {
      background: rgba(217,83,79,.12);
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 12px;
    }

    /* ================= LAYOUT ================= */

    main {
      max-width: 1400px;
      margin: auto;
      padding: 30px 20px 70px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h1 {
      margin: 0;
      color: var(--gold);
      font-size: 30px;
    }

    .page-title p {
      color: var(--muted);
      margin: 8px 0 0;
    }

    .message {
      padding: 13px 16px;
      border-radius: 9px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      background: rgba(212,175,55,.06);
      color: var(--gold-light);
    }

    .message.success {
      border-color: rgba(54,179,126,.4);
      color: #69dda9;
      background: rgba(54,179,126,.08);
    }

    .message.error {
      border-color: rgba(217,83,79,.45);
      color: #ff8b87;
      background: rgba(217,83,79,.08);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: linear-gradient(145deg, #191919, #111111);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 23px;
      margin-bottom: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .card-title {
      color: var(--gold);
      margin: 0 0 20px;
      font-size: 20px;
    }/* ================= FORM ================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      color: #ddd;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0d0d0d;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212,175,55,.08);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    select option {
      background: #151515;
      color: #fff;
    }

    .checkbox-row {
      display: flex;
      gap: 25px;
      align-items: center;
      margin-top: 10px;
    }

    .checkbox {
      display: flex;
      gap: 8px;
      align-items: center;
      cursor: pointer;
      color: #ddd;
    }

    .checkbox input {
      width: auto;
      accent-color: var(--gold);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .form-actions .btn {
      min-width: 150px;
    }

    /* ================= IMAGES ================= */

    .upload-box {
      border: 1px dashed rgba(212,175,55,.45);
      border-radius: 12px;
      padding: 18px;
      background: rgba(212,175,55,.025);
    }

    .upload-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .image-item {
      position: relative;
      aspect-ratio: 1 / .8;
      overflow: hidden;
      border-radius: 9px;
      border: 1px solid #333;
      background: #080808;
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-remove {
      position: absolute;
      top: 5px;
      left: 5px;
      border: 0;
      border-radius: 50%;
      width: 27px;
      height: 27px;
      background: rgba(0,0,0,.8);
      color: #ff7777;
      font-size: 18px;
    }

    /* ================= FILTERS ================= */

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    /* ================= MATERIAL CARDS ================= */

    .materials-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .material-card {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 13px;
      overflow: hidden;
      transition: .2s;
    }

    .material-card:hover {
      border-color: rgba(212,175,55,.55);
      transform: translateY(-2px);
    }

    .material-image {
      height: 190px;
      background: #080808;
    }

    .material-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
    }

    .material-body {
      padding: 15px;
    }

    .material-name {
      font-size: 17px;
      font-weight: bold;
      color: var(--gold);
    }

    .material-en {
      color: #aaa;
      font-size: 12px;
      margin-top: 4px;
    }

    .material-meta {
      margin-top: 12px;
      color: #bbb;
      font-size: 12px;
      line-height: 1.8;
    }

    .material-actions {
      display: flex;
      gap: 7px;
      margin-top: 14px;
    }

    .material-actions button {
      flex: 1;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 10px;
      margin-bottom: 8px;
    }

    .badge-active {
      background: rgba(54,179,126,.12);
      color: #69dda9;
    }

    .badge-inactive {
      background: rgba(255,255,255,.06);
      color: #888;
    }.badge-featured {
      background: rgba(212,175,55,.12);
      color: var(--gold);
      margin-right: 5px;
    }

    /* ================= CATEGORIES ================= */

    .category-list {
      display: grid;
      gap: 10px;
    }

    .category-row {
      display: grid;
      grid-template-columns: 55px 1fr 1fr 80px 120px;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 9px;
    }

    .category-icon {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      background: #202020;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 20px;
    }

    .category-name {
      color: #fff;
      font-weight: bold;
    }

    .category-name-en {
      color: #888;
      font-size: 12px;
    }

    .category-actions {
      display: flex;
      gap: 5px;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      width: min(650px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #171717;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: var(--gold);
      margin: 0;
    }

    .close {
      background: transparent;
      color: #aaa;
      font-size: 25px;
      border: 0;
    }

    /* ================= LOADING ================= */

    .loading {
      text-align: center;
      padding: 35px;
      color: var(--gold);
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #777;
      border: 1px dashed #333;
      border-radius: 10px;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 1100px) {
      .materials-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 850px) {
      .grid-2,
      .filters,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .materials-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .category-row {
        grid-template-columns: 45px 1fr;
      }

      .category-actions {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 550px) {
      .materials-grid {
        grid-template-columns: 1fr;
      }

      main {
        padding: 20px 12px;
      }

      .header-inner {
        padding: 15px;
      }

      .header-actions {
        flex-direction: column;
      }

      .form-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div>
      <div class="brand">PRIME SCOPE</div>
      <small id="userEmail"></small>
    </div>

    <div class="header-actions">

      <button
        class="btn btn-dark"
        onclick="window.open('/', '_blank')">
        فتح الموقع
      </button>

      <button
        class="btn btn-gold"
        id="logoutBtn">
        تسجيل الخروج
      </button>

    </div>

  </div>
</header>


<main>

  <div class="page-title">
    <h1>لوحة تحكم Prime Scope</h1>
    <p>إدارة التصنيفات والخامات والصور</p>
  </div>

  <div id="message" class="hidden"></div>


  <!-- =====================================================
       CATEGORIES
  ====================================================== -->

  <div class="card">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap">

      <h2 class="card-title">
        التصنيفات الرئيسية
      </h2>

      <button
        class="btn btn-gold"
        onclick="openCategoryModal()">
        + إضافة تصنيف
      </button>

    </div>

    <div
      id="categoriesList"
      class="category-list"><div class="loading">
        جاري تحميل التصنيفات...
      </div>

    </div>

  </div>


  <!-- =====================================================
       MATERIAL FORM
  ====================================================== -->

  <div class="card">

    <h2
      id="materialFormTitle"
      class="card-title">
      إضافة خامة جديدة
    </h2>

    <form id="materialForm">

      <div class="form-grid">

        <div>
          <label>Material ID *</label>
          <input id="id" required>
        </div>

        <div>
          <label>Category</label>
          <select id="category_id">
            <option value="">-- اختر التصنيف --</option>
          </select>
        </div>

        <div>
          <label>اسم الخامة بالعربي *</label>
          <input id="name_ar" required>
        </div>

        <div>
          <label>اسم الخامة بالإنجليزي *</label>
          <input id="name_en" required>
        </div>

        <div>
          <label>بلد المنشأ</label>
          <input
            id="origin"
            placeholder="Italy / Spain / Egypt...">
        </div>

        <div>
          <label>Stone Type</label>
          <input id="stone_type">
        </div>

        <div>
          <label>وصف اللون</label>
          <input id="color_desc">
        </div>

        <div>
          <label>Color Group</label>
          <input id="color_group">
        </div>

        <div>
          <label>Type Arabic</label>
          <input id="type_ar">
        </div>

        <div>
          <label>Type English</label>
          <input id="type_en">
        </div>

        <div>
          <label>Finish</label>
          <input id="finish">
        </div>

        <div>
          <label>Price Tier</label>
          <input id="price_tier">
        </div>

        <div>
          <label>Color HEX</label>
          <input
            id="color_hex"
            placeholder="#FFFFFF">
        </div>

        <div>
          <label>Density</label>
          <input
            id="density"
            type="number"
            step="any">
        </div>

        <div>
          <label>Water Absorption</label>
          <input
            id="water_absorption"
            type="number"
            step="any">
        </div>

        <div>
          <label>Compressive Strength</label>
          <input
            id="compressive_strength"
            type="number"
            step="any">
        </div>

        <div>
          <label>Durability Score</label>
          <input
            id="durability_score"
            type="number"
            step="any">
        </div>

        <div>
          <label>Maintenance Tier</label>
          <input id="maintenance_tier">
        </div>

        <div>
          <label>Texture Grade</label>
          <input id="texture_grade">
        </div>

        <div class="full">
          <label>Usage Arabic</label>
          <textarea id="usage_ar"></textarea>
        </div>

        <div class="full">
          <label>Usage English</label>
          <textarea id="usage_en"></textarea>
        </div>

        <!-- IMAGES -->

        <div class="full">

          <label>
            صور الخامة
          </label>

          <div class="upload-box">

            <input
              id="imageFiles"
              type="file"
              accept="image/*"
              multiple>

            <div class="upload-note">
              يمكنك اختيار أكثر من صورة.
              الصور الجديدة ستضاف إلى الصور الموجودة عند التعديل.
            </div>

            <div
              id="imagePreview"
              class="images-grid">
            </div>

          </div>

        </div>

      </div>


      <div class="checkbox-row">

        <label class="checkbox">
          <input
            id="is_featured"
            type="checkbox">
          Featured
        </label>

        <label class="checkbox">
          <input
            id="is_active"
            type="checkbox"
            checked>
          Active
        </label>

      </div>


      <div class="form-actions"><button
          type="submit"
          class="btn btn-gold"
          id="saveMaterialBtn">
          حفظ الخامة
        </button>

        <button
          type="button"
          class="btn btn-dark hidden"
          id="cancelEditBtn">
          إلغاء التعديل
        </button>

      </div>

    </form>

  </div>


  <!-- =====================================================
       FILTERS
  ====================================================== -->

  <div class="card">

    <h2 class="card-title">
      الخامات
    </h2>

    <div class="filters">

      <div>

        <label>التصنيف</label>

        <select id="filterCategory">
          <option value="">كل التصنيفات</option>
        </select>

      </div>

      <div>

        <label>بلد المنشأ</label>

        <select id="filterOrigin">
          <option value="">كل البلاد</option>
        </select>

      </div>

      <div>

        <label>بحث</label>

        <input
          id="searchInput"
          placeholder="اسم الخامة...">

      </div>

    </div>

  </div>


  <!-- =====================================================
       MATERIALS
  ====================================================== -->

  <div class="card">

    <div
      id="materialsGrid"
      class="materials-grid">

      <div class="loading">
        جاري تحميل الخامات...
      </div>

    </div>

  </div>

</main>


<!-- =======================================================
     CATEGORY MODAL
======================================================== -->

<div
  id="categoryModal"
  class="modal hidden">

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="categoryModalTitle">
        إضافة تصنيف
      </h2>

      <button
        class="close"
        onclick="closeCategoryModal()">
        ×
      </button>

    </div>


    <form id="categoryForm">

      <input
        type="hidden"
        id="categoryEditId">


      <div class="form-grid">

        <div>
          <label>Category ID *</label>
          <input
            id="categoryId"
            required>
        </div>

        <div>
          <label>Sort Order</label>
          <input
            id="categorySort"
            type="number"
            value="0">
        </div>

        <div>
          <label>الاسم بالعربي *</label>
          <input
            id="categoryNameAr"
            required>
        </div>

        <div>
          <label>الاسم بالإنجليزي *</label>
          <input
            id="categoryNameEn"
            required>
        </div>

        <div>
          <label>Icon</label>
          <input
            id="categoryIcon"
            placeholder="marble">
        </div>

        <div>
          <label>Badge</label>
          <input
            id="categoryBadge">
        </div>

      </div>


      <label class="checkbox" style="margin-top:15px">

        <input
          id="categoryActive"
          type="checkbox"
          checked>

        Active

      </label>


      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-gold">
          حفظ التصنيف
        </button>

        <button
          type="button"
          class="btn btn-dark"
          onclick="closeCategoryModal()">
          إلغاء
        </button>

      </div>

    </form>

  </div>

</div>


<script>

  /* ======================================================
     SUPABASE
  ====================================================== */

  const supabaseClient =
    window.supabase.createClient(
      window.PRIME_CONFIG.SUPABASE_URL,
      window.PRIME_CONFIG.SUPABASE_ANON_KEY
    );


  let currentUser = null;

  let materials = [];

  let categories = [];

  let editingMaterialId = null;

  let selectedFiles = [];

  let existingImages = [];


  /* ======================================================
     HELPERS
  ====================================================== */

  function val(id) {

    return document
      .getElementById(id)
      .value
      .trim();

  }


  function nullable(id) {

    const value = val(id);return value === ""
      ? null
      : value;

  }


  function numberOrNull(id) {

    const value = val(id);

    if (value === "") {
      return null;
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
      throw new Error(
        "القيمة الرقمية غير صحيحة: " + id
      );
    }

    return number;

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function showMessage(text, type = "") {

    const box =
      document.getElementById("message");

    box.textContent = text;

    box.className =
      "message " + type;

    box.classList.remove("hidden");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ======================================================
     AUTH
  ====================================================== */

  async function checkAuth() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error || !data.session) {

      window.location.href =
        "admin.html";

      return false;

    }


    currentUser =
      data.session.user;


    document.getElementById("userEmail")
      .textContent =
      currentUser.email;


    return true;

  }


  document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      window.location.href =
        "admin.html";

    });


  /* ======================================================
     CATEGORIES
  ====================================================== */

  async function loadCategories() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("categories")
        .select("*")
        .order("sort_order", {
          ascending: true
        });


    if (error) {

      console.error(error);

      showMessage(
        "فشل جلب التصنيفات: " +
        error.message,
        "error"
      );

      return;

    }


    categories = data || [];


    renderCategories();

    populateCategorySelects();

  }


  function renderCategories() {

    const container =
      document.getElementById(
        "categoriesList"
      );


    if (!categories.length) {

      container.innerHTML =
        <div class="empty">
          لا توجد تصنيفات.
        </div>;

      return;

    }


    container.innerHTML =
      categories.map(category => {

        return

  async function loadMaterials() {

      document.getElementById(
        "materialsGrid"
      );

      <div class="loading">
        جاري تحميل الخامات...
      </div>;


    const {
      data,
      error

        .from("materials")

  function updateOriginFilter() {

    const select =
      document.getElementById(
        "filterOrigin"
      );


    const current =
      select.value;


    const origins =
      [
        ...new Set(
          materials
            .map(item => item.origin)
            .filter(Boolean)
            .map(item => String(item).trim())
        )
      ]
      .sort();


    select.innerHTML =
      <option value="">
        كل البلاد
      </option>;


    origins.forEach(origin => {

      select.innerHTML +=
        <option value="${escapeHtml(origin)}">
          ${escapeHtml(origin)}
        </option>;

    });


    if (
      origins.includes(current)
    ) {

      select.value = current;

    }

  }


  function renderMaterials() {

    const grid =
      document.getElementById(
        "materialsGrid"
      );


    const category =
      document.getElementById(
        "filterCategory"
      ).value;


    const origin =
      document.getElementById(
        "filterOrigin"
      ).value;


    const search =
      document.getElementById(
        "searchInput"
      ).value
      .trim()
      .toLowerCase();


    const filtered =
      materials.filter(material => {if (
          category &&
          String(material.category_id) !==
          String(category)
        ) {
          return false;
        }


        if (
          origin &&
          String(material.origin || "") !==
          String(origin)
        ) {
          return false;
        }


        if (search) {

          const text =
            [
              material.name_ar,
              material.name_en,
              material.origin,
              material.stone_type,
              material.type_ar,
              material.type_en
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


          if (!text.includes(search)) {

            return false;

          }

        }


        return true;

      });


    if (!filtered.length) {

      grid.innerHTML =
        <div class="empty">
          لا توجد خامات مطابقة للبحث.
        </div>;

      return;

    }


    grid.innerHTML =

            normalizeImages(
              material.images

            images[0] || "";

  /* ======================================================
     IMAGE HANDLING
  ====================================================== */function normalizeImages(images) {

    if (Array.isArray(images)) {
      return images.filter(Boolean);
    }


    if (typeof images === "string") {

      try {

        const parsed =
          JSON.parse(images);

        if (Array.isArray(parsed)) {
          return parsed.filter(Boolean);
        }

      } catch (_) {

        if (images.trim()) {
          return [images.trim()];
        }

      }

    }


    return [];

  }


  document
    .getElementById("imageFiles")
    .addEventListener(
      "change",
      function() {

            ...Array.from(this.files)

  function renderImagePreview() {

    const preview =
      document.getElementById(
        "imagePreview"
      );


    preview.innerHTML = "";


    existingImages.forEach(
      (url, index) => {

        const box =
          document.createElement(
            "div"
          );

        box.className =
          "image-item";


        box.innerHTML = 

          <img
            src="${escapeAttribute(url)}"
            alt="Existing image">

          <button
            type="button"
            class="image-remove"
            onclick="removeExistingImage(${index})">
            ×
          </button>

        ;


        preview.appendChild(box);

      }
    );


    selectedFiles.forEach(
      (file, index) => {

        const box =
          document.createElement(
            "div"
          );

        box.className =
          "image-item";


        const image =
          document.createElement("img");


        image.src =
          URL.createObjectURL(file);


        const button =
          document.createElement(
            "button"
          );


        button.type = "button";

        button.className =
          "image-remove";

        button.textContent = "×";


        button.onclick = function() {

          selectedFiles.splice(
            index,
            1
          );

          renderImagePreview();

        };


        box.appendChild(image);

        box.appendChild(button);

        preview.appendChild(box);

      }
    );

  }


  window.removeExistingImage =
    function(index) {

      existingImages.splice(
        index,
        1
      );

      renderImagePreview();

    };


  async function uploadImage(
    file,
    materialId
  ) {

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      materialId +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;


    const {
      error
    } =
      await supabaseClient.storage
        .from(
          window.PRIME_CONFIG
            .STORAGE_BUCKETS
            .MATERIALS
        )
        .upload(
          fileName,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (error) {
      throw error;
    }


    const {
      data
    } =
      supabaseClient.storage
        .from(
          window.PRIME_CONFIG
            .STORAGE_BUCKETS
            .MATERIALS
        )
        .getPublicUrl(
          fileName
        );


    return data.publicUrl;

  }

  function escapeAttribute(value) {

    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }
